[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "addmaple"
version = "0.1.0"
description = "AddMaple client for loading datasets and writing external columns"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "AddMaple", email = "hello@addmaple.com" }]
keywords = ["addmaple", "arrow", "analytics", "survey", "data"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "pyarrow>=15",
  "pandas>=2.0",
]

[project.optional-dependencies]
polars = ["polars>=1.0"]
dev = ["pytest>=8", "build>=1.2", "twine>=6.0"]

[project.urls]
Homepage = "https://addmaple.com"
Documentation = "https://addmaple.com/help"
Repository = "https://github.com/addmaple/addmaple-python"
Issues = "https://github.com/addmaple/addmaple-python/issues"
Changelog = "https://github.com/addmaple/addmaple-python/releases"

[tool.hatch.build.targets.wheel]
packages = ["addmaple"]

[tool.hatch.build.targets.sdist]
include = [
  "/addmaple",
  "/tests",
  "/scripts",
  "/README.md",
  "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: live HTTP tests against a running AddMaple server (env-gated)",
]
